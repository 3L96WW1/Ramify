plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = '0.2.0-beta+1.21.1'
group = 'com.ginka.ramify'
base { archivesName = 'ramify' }

repositories { mavenCentral() }

loom {
    runs {
        client {
            programArgs "--username", "Ginka"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
